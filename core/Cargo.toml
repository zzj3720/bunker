[package]
name = "bunker-core"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Bunker's local core: SPT instances, server and game launch, paired mod management, snapshots, config editing"

[lib]
name = "bunker_core"
crate-type = ["staticlib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
flate2 = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
sevenz-rust = { version = "0.6", default-features = false }
ureq = { version = "2.10", default-features = false, features = ["tls", "json"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
# (the fake SPT server, src/bin/fake_spt.rs, used by the tests: its self-signed certificate)
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Console", "Win32_System_Threading", "Win32_System_SystemInformation", "Win32_System_Time"] }

[dev-dependencies]
sevenz-rust = { version = "0.6", default-features = false, features = ["compress"] }

[profile.release]
opt-level = 3
debug = false
