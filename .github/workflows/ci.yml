# Bunker's CI on GitHub's free runners: the Rust core's unit and end-to-end tests (Windows, where it runs).
# The Pion UI is gated by `sh tools/check.sh` (pionc check + Tester gates) and built by `tools/build-win.sh`
# on our own machines (pionc is not packaged for CI runners).
name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  core:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
        working-directory: core
    steps:
      - run: git config --global core.autocrlf false
        working-directory: ${{ github.workspace }}
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            core/target
          key: core-${{ runner.os }}-${{ hashFiles('core/Cargo.lock', 'core/Cargo.toml') }}
          restore-keys: core-${{ runner.os }}-
      - name: cargo test
        run: cargo test --no-fail-fast
